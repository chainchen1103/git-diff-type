name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    ext: .exe }
          - { os: macos-latest,   target: aarch64-apple-darwin,      ext: "" }
          - { os: macos-latest,   target: x86_64-apple-darwin,       ext: "" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl, ext: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gca-rs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Test
        run: cargo test --release
      - name: Build gca
        run: cargo build --release --bin gca --target ${{ matrix.target }}
      - name: Build installer (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # The installer embeds target/release/gca.exe.
          mkdir -p target/release
          cp target/${{ matrix.target }}/release/gca.exe target/release/gca.exe
          cargo build --release --bin gca-installer --features installer
      - name: Package
        shell: bash
        run: |
          mkdir -p ../dist
          cp target/${{ matrix.target }}/release/gca${{ matrix.ext }} ../dist/gca-${{ matrix.target }}${{ matrix.ext }}
          if [ "${{ runner.os }}" = "Windows" ]; then cp target/release/gca-installer.exe ../dist/gca-installer.exe; fi
      - uses: actions/upload-artifact@v4
        with:
          name: gca-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
