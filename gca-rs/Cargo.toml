[package]
name = "gca-rs"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gca"
path = "src/main.rs"

[[bin]]
name = "gca-installer"
path = "src/bin/installer.rs"
required-features = ["installer"]

[features]
installer = ["dep:winreg"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
