[package]
name = "gca-rs"
version = "0.5.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Suggests a Conventional Commit type from your staged diff, then commits"
repository = "https://github.com/chainchen1103/git-diff-type"
readme = "../README.md"

[[bin]]
name = "gca"
path = "src/main.rs"

# Windows installer. It embeds target/release/gca.exe, so build gca first:
#   cargo build --release --bin gca
#   cargo build --release --bin gca-installer --features installer
[[bin]]
name = "gca-installer"
path = "src/bin/installer.rs"
required-features = ["installer"]

[features]
installer = ["dep:winreg"]
# Subject drafts written by a small neural model (src/t5draft/), from a model
# file downloaded separately:
#   cargo build --release --features t5
t5 = ["dep:candle-core", "dep:candle-nn", "dep:tokenizers"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
console = "0.15"
ctrlc = "3"
# completion: Tab fills in the subject draft
dialoguer = { version = "0.11", features = ["completion"] }
# The t5 feature. candle is pinned: src/t5draft/runtime.rs relies on its
# quantized tensor formats.
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
tokenizers = { version = "0.22", optional = true, default-features = false, features = ["fancy-regex"] }

[target.'cfg(windows)'.dependencies]
winreg = { version = "0.55", optional = true }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
